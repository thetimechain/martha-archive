app = "martha"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  RUN_MIGRATIONS = "1"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[deploy]
  strategy = "rolling"
